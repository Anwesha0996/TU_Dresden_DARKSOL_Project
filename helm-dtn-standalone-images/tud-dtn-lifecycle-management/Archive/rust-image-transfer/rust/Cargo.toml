[workspace]
resolver = "2"
members = [
    "aap2-common",
    "aap2-image-sender",
    "aap2-image-receiver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
aap2-common = { path = "aap2-common" }

tokio = { version = "1", features = ["full", "test-util"] }
prost = "0.13"
prost-build = "0.13"
bytes = "1"

clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
