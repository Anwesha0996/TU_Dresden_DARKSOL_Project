# Harbor configuration for the helm-dtn local test harness.
#
# THIS IS A LOCAL-TESTING-ONLY CONFIGURATION. Default admin credentials,
# plaintext DB password, and no TLS. Do not reuse any of this outside a
# throwaway local Docker Compose stack. See ../../../TASKS.md non-goals.
#
# Generated docker-compose.yml + common/config/* are produced by running
# ./fetch-and-prepare.sh in this directory (see README in the parent dir);
# those generated files are gitignored, this hand-maintained harbor.yml is
# the only checked-in Harbor config.
#
# Pinned Harbor version: v2.15.2 (see ../../../doc/rust-image-transfer/00-aap2-notes.md §4)

# Reachable from the host as well as from the earth-node/space-node
# containers (all three are placed on the same custom bridge network,
# `dtn-net`, with this hostname set as a network alias for Harbor's proxy
# service). Add "127.0.0.1 harbor.local-test" to /etc/hosts for host-side
# access (docker/skopeo/curl from your shell).
hostname: harbor.local-test

http:
  # Host-mapped port. From the host: http://harbor.local-test:8091
  # (remapped from the documented 8081 - that port, and 8082, were already in
  # use by unrelated containers on this machine)
  # From containers on dtn-net: http://harbor.local-test:8080 (container-internal,
  # reaches the proxy service directly via Docker's embedded DNS + network alias).
  port: 8091

# No https block: local test harness only, plaintext HTTP is acceptable here.
# (Clients such as skopeo will need --dest-tls-verify=false / --tls-verify=false.)

harbor_admin_password: Harbor12345

database:
  password: root123
  max_idle_conns: 100
  max_open_conns: 900
  conn_max_lifetime: 5m
  conn_max_idle_time: 0

# Absolute host path, must live under a directory Docker Desktop shares into
# its VM (macOS default shares $HOME) since Harbor's generated compose file
# bind-mounts this directly.
data_volume: /Users/rishidhar/Anwesha/Iris_hiwi/helm-dtn-main/deploy/local-test/harbor/data

trivy:
  ignore_unfixed: false
  skip_update: false
  skip_java_db_update: false
  db_repository: ghcr.io/aquasecurity/trivy-db
  java_db_repository: ghcr.io/aquasecurity/trivy-java-db
  offline_scan: false
  security_check: vuln
  insecure: false
  timeout: 5m0s

jobservice:
  max_job_workers: 10
  max_job_duration_hours: 24
  job_loggers:
    - STD_OUTPUT
  logger_sweeper_duration: 1

notification:
  webhook_job_max_retry: 3
  webhook_job_http_client_timeout: 3

log:
  level: info
  local:
    rotate_count: 50
    rotate_size: 200M
    location: /Users/rishidhar/Anwesha/Iris_hiwi/helm-dtn-main/deploy/local-test/harbor/log

_version: 2.15.0

proxy:
  http_proxy:
  https_proxy:
  no_proxy:
  components:
    - core
    - jobservice
    - trivy

upload_purging:
  enabled: true
  age: 168h
  interval: 24h
  dryrun: false

cache:
  enabled: false
  expire_hours: 24
