# Local test harness for the Rust image-transfer work (TASKS.md Phase 1).
#
# Brings up:
#   - earth-node / space-node: two µD3TN v0.15.0 instances (see ud3tn/Dockerfile),
#     connected via the tcpclv3 convergence layer, each with AAP2 exposed on TCP.
#   - Harbor v2.15.2 (harbor/docker-compose.yml, generated by
#     harbor/fetch-and-prepare.sh from the checked-in harbor/harbor.yml -
#     see ../README.md).
#
# Usage: see ../README.md. Short version:
#   ./harbor/fetch-and-prepare.sh   # one-time (or after harbor.yml changes)
#   docker compose up -d
#
# Harbor is pulled in via `include:` rather than plain multi-file `-f` merging
# so its relative paths (./common/config/..., ./data, ...) resolve against
# harbor/'s own directory instead of this file's - `include:` scopes included
# files' relative paths correctly; `-f` merging does not.
#
# NOTE (Phase 1 scope): Harbor is reachable from the HOST at
# http://harbor.local-test:8081 (add "127.0.0.1 harbor.local-test" to
# /etc/hosts) - that satisfies this phase's "Harbor reachable at a known
# host:port" requirement. Reachability from *inside* space-node (needed for
# the real `skopeo push` in Phase 5) is deliberately not wired up yet since
# `include:` does not let us attach a network alias to Harbor's proxy
# service from here; Phase 5 will attach space-node to the `harbor` network
# (declared in harbor/docker-compose.yml) and resolve Harbor via its
# container name (`nginx`) or add a proper alias at that point.

include:
  - path: harbor/docker-compose.yml

services:
  earth-node:
    build:
      context: ./ud3tn
    container_name: earth-node
    hostname: earth-node
    command:
      - "--node-id"
      - "dtn://earth.dtn/"
      - "--aap2-host"
      - "0.0.0.0"
      - "--aap2-port"
      - "4242"
      - "--cla"
      - "tcpclv3:*,4556"
      - "--log-level"
      - "4"
      - "--allow-remote-config"
    ports:
      - "14242:4242" # AAP2 TCP, host-side access for local debugging/tooling
    cap_add:
      - NET_ADMIN # required for tc/netem link disruption injection, see ../README.md
    networks:
      dtn-net:
        aliases:
          - earth-node

  space-node:
    build:
      context: ./ud3tn
    container_name: space-node
    hostname: space-node
    command:
      - "--node-id"
      - "dtn://space.dtn/"
      - "--aap2-host"
      - "0.0.0.0"
      - "--aap2-port"
      - "4242"
      - "--cla"
      - "tcpclv3:*,4556"
      - "--log-level"
      - "4"
      - "--allow-remote-config"
    ports:
      - "24242:4242" # AAP2 TCP, host-side access for local debugging/tooling
    cap_add:
      - NET_ADMIN
    networks:
      dtn-net:
        aliases:
          - space-node

networks:
  dtn-net:
    name: dtn-net
    driver: bridge
