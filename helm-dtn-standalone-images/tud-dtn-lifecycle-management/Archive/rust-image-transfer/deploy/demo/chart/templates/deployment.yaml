apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-alpine
  labels:
    app: demo-alpine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-alpine
  template:
    metadata:
      labels:
        app: demo-alpine
    spec:
      containers:
        - name: demo-alpine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh"]
          args: ["-c", "while true; do echo Running; sleep 10; done"]
