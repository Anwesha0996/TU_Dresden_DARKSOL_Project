apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-app.fullname" . }}
  labels:
    {{ include "web-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{ include "web-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{ include "web-app.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
      - name: asset-volume
        emptyDir: {}
      initContainers:
      - name: git-fetcher
        image: alpine/git:latest 
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - git clone {{ .Values.assetFetch.repositoryUrl }} {{ .Values.assetFetch.targetPath }}
        volumeMounts:
        - name: asset-volume
          mountPath: /mnt/assets
      containers:
        - name: web-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
          - name: asset-volume
            mountPath: /app/static

